# ==============================================================================
# MedFlow — Render Blueprint Infrastructure as Code (Free Tier)
# ==============================================================================
# Architecture:
#   1. medflow-api: FastAPI backend with SimPy & OR-Tools (Docker Web Service, Free Plan)
#   2. medflow-dashboard: React 19 + TypeScript SPA (Render Static Site)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: medflow-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "/app"
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "https://medflow-dashboard.onrender.com,http://localhost:3000,http://localhost:5173"
      - key: MAX_SIMULATION_HOURS
        value: "168"
      - key: MAX_MONTE_CARLO_REPLICATIONS
        value: "10"
      - key: OPTIMIZER_TIME_LIMIT_SECONDS
        value: "20"
      - key: DATABASE_URL
        value: "sqlite:///./medflow.db"

  # ----------------------------------------------------------------------------
  # 2. React TypeScript Frontend (Static Site)
  # Notice: No region or plan specified for static site per Render Blueprint schema.
  # ----------------------------------------------------------------------------
  - type: web
    name: medflow-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://medflow-api.onrender.com
