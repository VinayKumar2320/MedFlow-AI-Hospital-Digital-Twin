name: MedFlow Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    name: Backend Lint, Test & Simulation Invariants
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System OpenMP Runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python Package & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest ruff httpx

      - name: Run Ruff Code Quality & Formatting Checks
        run: |
          ruff check backend ml simulation optimization scripts

      - name: Verify Automated Bootstrap & Schema Seeding
        run: |
          PYTHONPATH=. python scripts/bootstrap_demo.py

      - name: Execute Full Pytest Test Suite
        run: |
          PYTHONPATH=. pytest backend/tests -v --durations=10

  frontend-validation:
    name: Frontend TypeScript Verification & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React TypeScript Application
        working-directory: frontend
        run: npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f frontend/dist/index.html
          echo "Frontend SPA production bundle built successfully."
