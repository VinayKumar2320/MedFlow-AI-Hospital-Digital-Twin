version: '3.8'

services:
  medflow-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medflow-digital-twin
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./medflow.db
      - DEBUG=false
      - DEFAULT_RANDOM_SEED=42
    volumes:
      - medflow-data:/app/ml/artifacts
      - medflow-datasets:/app/ml/datasets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional PostgreSQL container for enterprise deployments
  postgres:
    image: postgres:16-alpine
    container_name: medflow-postgres
    profiles:
      - postgres
    environment:
      POSTGRES_DB: medflow
      POSTGRES_USER: medflow_user
      POSTGRES_PASSWORD: medflow_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  medflow-data:
  medflow-datasets:
  pgdata:
